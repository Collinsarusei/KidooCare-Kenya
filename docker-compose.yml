services:
  postgres:
    image: postgres:16
    container_name: daycare_postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: daycare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: daycare_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
