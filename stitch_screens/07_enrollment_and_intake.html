<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Service Detail / Enrollment Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#121c2a",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "error": "#ba1a1a",
                        "primary": "#004ac6",
                        "on-secondary-container": "#00714d",
                        "tertiary": "#784b00",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#00174b",
                        "tertiary-fixed-dim": "#ffb95f",
                        "tertiary-container": "#996100",
                        "surface-container-high": "#dee9fc",
                        "surface-container-highest": "#d9e3f6",
                        "inverse-surface": "#27313f",
                        "on-tertiary-container": "#ffeedd",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-dim": "#d0dbed",
                        "secondary-fixed-dim": "#4edea3",
                        "inverse-primary": "#b4c5ff",
                        "on-secondary-fixed": "#002113",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#6ffbbe",
                        "surface-bright": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "secondary": "#006c49",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-fixed": "#ffddb8",
                        "outline": "#737686",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface": "#f8f9ff",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "surface-container": "#e6eeff",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#d9e3f6",
                        "secondary-container": "#6cf8bb",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#eff4ff",
                        "background": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#121c2a",
                        "on-tertiary-fixed": "#2a1700",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "xl": "48px",
                        "container-max": "1280px",
                        "base": "4px",
                        "gutter": "16px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "h1-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "h3": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "h2": ["Plus Jakarta Sans"],
                        "h2-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "h1-mobile": ["30px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "h2": ["30px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "h2-mobile": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-glow:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .card-shadow {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant shadow-sm docked full-width top-0 sticky z-50">
<div class="flex justify-between items-center px-md md:px-lg h-16 md:h-20 w-full max-w-container-max mx-auto">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-h2-mobile md:font-h2 text-h2-mobile md:text-h2 text-primary tracking-tight">KiddoCare Kenya</div>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high p-2 rounded-full transition-all duration-200">notifications</span>
<img class="w-10 h-10 rounded-full object-cover border border-outline-variant" data-alt="A small, friendly circular avatar showing a smiling parent. The image is warm, well-lit, and fits a modern, inviting UI design. Soft background colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsAdOXBfEVanYYg4EzLs-PvD1KmroL7PyQukP09DpXyyWmgvfBlkmDYpr4KKmecR4DlcS77BZ1rzG3G9muM2fksEvgFrPxzjVLW1xIs9d_2YaLUjBpX64LYdM6gRB72bJHMLw4_ImMZclN3IoupuYm5SLpPKhMlcWryXn3kCBYQ5t7sEDwAoa6dISfkOLD-xdsvwUsOhcqQ7AlHBo7Z4DTHXORe9Qa6FzRPB4iwDBUkfD_F2zssyZvp-8wMWOu5NZl-har1y4ywGUR"/>
</div>
</div>
</header>
<main class="max-w-3xl mx-auto px-md md:px-lg py-lg">
<!-- Progress Indicator -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Step 1 of 2</span>
<span class="font-label-md text-label-md text-primary">Child Information</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 50%"></div>
</div>
</div>
<!-- Service Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-md md:p-lg mb-lg border border-[#F3F4F6] card-shadow">
<div class="flex items-start gap-md">
<div class="bg-cover bg-center w-24 h-24 rounded-lg flex-shrink-0" data-alt="A bright, cheerful childcare setting showing colorful educational toys and soft play mats. The scene is bathed in natural sunlight, emphasizing safety and warmth, suitable for a modern Kenyan daycare app." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCTp0UeYdZImC98kb_hEcOUNURifimpElHPlF7zGpcPB3Btq5JpFIK1jKAWpl6bllaGOw3ZTaYIlCJ7gJPT27xGfE2GxTYXA3I5upp3Z7EJt1ORFZ7w6t2XpvmbtbohnG4u0PpHaLURjUqDGeBbDHlJG-paqHAUNE9y_VdBq2TQzEPAUa0GMxzO2_Cjdx4CnBX7PVNJQkOohXEahgiS-rqP1568A_AJHCZtLWCRwP4qnJGCYc7i-yNwZXWjcChJ_2hdpxqgLSJLeYXf')"></div>
<div class="flex-grow">
<div class="flex justify-between items-start">
<div>
<h2 class="font-h3 text-h3 text-on-surface mb-xs">Full-Day Childcare</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sunshine Daycare Center</p>
</div>
<span class="font-label-md text-label-md text-primary bg-primary-container/10 px-3 py-1 rounded-full">Selected</span>
</div>
<div class="mt-sm flex gap-md font-caption text-caption text-on-surface-variant">
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">calendar_month</span> Mon - Fri</span>
<span class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">schedule</span> 8:00 AM - 5:00 PM</span>
</div>
</div>
</div>
</div>
<!-- Enrollment Form -->
<div class="bg-surface-container-lowest rounded-xl p-md md:p-lg border border-[#F3F4F6] card-shadow">
<h1 class="font-h2-mobile md:font-h2 text-h2-mobile md:text-h2 text-on-surface mb-lg">Child Details</h1>
<form class="space-y-lg">
<!-- Name Field -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="firstName">First Name</label>
<input class="w-full rounded-md border-[#F3F4F6] font-body-md text-body-md text-on-surface px-4 py-3 input-glow transition-all duration-200 bg-surface-bright placeholder:text-on-surface-variant/50" id="firstName" placeholder="e.g. Amani" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="lastName">Last Name</label>
<input class="w-full rounded-md border-[#F3F4F6] font-body-md text-body-md text-on-surface px-4 py-3 input-glow transition-all duration-200 bg-surface-bright placeholder:text-on-surface-variant/50" id="lastName" placeholder="e.g. Omondi" type="text"/>
</div>
</div>
<!-- DOB and Gender -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full rounded-md border-[#F3F4F6] font-body-md text-body-md text-on-surface px-4 py-3 input-glow transition-all duration-200 bg-surface-bright" id="dob" type="date"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="gender">Gender (Optional)</label>
<select class="w-full rounded-md border-[#F3F4F6] font-body-md text-body-md text-on-surface px-4 py-3 input-glow transition-all duration-200 bg-surface-bright" id="gender">
<option value="">Select...</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Prefer not to say</option>
</select>
</div>
</div>
<!-- Medical Notes -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="medical">Medical Notes &amp; Allergies</label>
<p class="font-caption text-caption text-on-surface-variant mb-sm">Please list any allergies, required medications, or special needs.</p>
<textarea class="w-full rounded-md border-[#F3F4F6] font-body-md text-body-md text-on-surface px-4 py-3 input-glow transition-all duration-200 bg-surface-bright placeholder:text-on-surface-variant/50" id="medical" placeholder="e.g. Allergic to peanuts. Requires asthma inhaler before physical activity." rows="4"></textarea>
</div>
<!-- Actions -->
<div class="flex flex-col md:flex-row justify-end gap-md pt-lg border-t border-[#F3F4F6]">
<button class="px-6 py-3 rounded-md bg-[#DBEAFE] text-primary font-label-md text-label-md hover:bg-surface-container-high transition-colors text-center" type="button">Save Draft</button>
<button class="px-6 py-3 rounded-md bg-[#2563EB] text-on-primary font-label-md text-label-md hover:bg-primary transition-colors shadow-md text-center flex justify-center items-center gap-xs" type="button">
                        Continue to Payment <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
